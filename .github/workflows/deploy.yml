name: 云端打包发布


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 上传静态产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

